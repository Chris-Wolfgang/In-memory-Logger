name: AOT smoke

# Trim / Native AOT compatibility verification (#122).
#
# Publishes tests/Wolfgang.Extensions.Logging.InMemoryLogger.Tests.AotSmoke, a console-app
# consumer with <PublishAot>true</PublishAot> and <PublishTrimmed>true</PublishTrimmed> that
# references the src library and calls every public member through the Microsoft.Extensions.Logging
# APIs a real consumer uses, then runs the native binary. An AOT-hostile pattern (dynamic generic
# instantiation, reflection on names the trimmer cannot see, runtime code generation) fails the
# publish (IL2xxx / IL3xxx warnings are errors) or the run.
#
# Linux only: Native AOT needs a platform linker, which ubuntu-latest has and a Windows box
# without the C++ workload does not.
#
# Two legs (fleet standard test-matrix item 4): `PublishAot + run` on linux-x64 and
# `PublishAot + run (linux-arm64)` on ubuntu-24.04-arm. The native binary is per-architecture,
# so the managed ARM64 stages in pr.yaml do not cover it. The arm64 runner is free on public
# repositories only; a private repository skips that leg by condition. The x64 job keeps its
# original name (#122 asks for it as a required check).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/Wolfgang.Extensions.Logging.InMemoryLogger.Tests.AotSmoke/**'
      - 'Directory.Build.props'
      - '.github/workflows/aot-smoke.yaml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aot-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  aot-smoke:
    name: PublishAot + run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Publish AOT smoke consumer
        run: |
          dotnet publish tests/Wolfgang.Extensions.Logging.InMemoryLogger.Tests.AotSmoke/Wolfgang.Extensions.Logging.InMemoryLogger.Tests.AotSmoke.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained \
            -o "$RUNNER_TEMP/aot-out"

      - name: Run AOT-published binary
        run: |
          set -e
          "$RUNNER_TEMP/aot-out/Wolfgang.Extensions.Logging.InMemoryLogger.Tests.AotSmoke"
          echo "AOT smoke exited cleanly - the library survives Native AOT + trimming."

  aot-smoke-arm64:
    name: PublishAot + run (linux-arm64)
    runs-on: ubuntu-24.04-arm
    if: ${{ !github.event.repository.private }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      # From repo-template aot-smoke.yaml: the arm64 image is not guaranteed to carry the
      # Native AOT linker prerequisites, so install them only when they are missing.
      - name: Install Native AOT prerequisites
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1             && dpkg-query -W -f='${Status}' zlib1g-dev 2>/dev/null | grep -q 'install ok installed'; then
            echo "clang ($(clang --version | head -n 1)) and zlib1g-dev are on the runner image; apt not needed."
            exit 0
          fi
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 update               && sudo apt-get -o Acquire::Retries=3 install -y clang zlib1g-dev; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt of 3 failed; retrying in $((attempt * 30)) s."
            sleep $((attempt * 30))
          done
          echo "::error::clang and zlib1g-dev could not be installed after 3 apt attempts."
          exit 1

      - name: Publish AOT smoke consumer
        run: |
          dotnet publish tests/Wolfgang.Extensions.Logging.InMemoryLogger.Tests.AotSmoke/Wolfgang.Extensions.Logging.InMemoryLogger.Tests.AotSmoke.csproj             -c Release             -r linux-arm64             --self-contained             -o "$RUNNER_TEMP/aot-out"

      - name: Run AOT-published binary
        run: |
          set -e
          "$RUNNER_TEMP/aot-out/Wolfgang.Extensions.Logging.InMemoryLogger.Tests.AotSmoke"
          echo "AOT smoke exited cleanly on linux-arm64 - the library survives Native AOT + trimming."
