name: "Cross-Platform Differential"

# pr.yaml's Stage 1/2/3 already verify the suite PASSES on Linux, Windows,
# and macOS — but not that it passes the SAME WAY on each. This workflow
# (#118) runs the identical test set on 4 platforms (including two genuinely
# ARM64 runners), normalizes each run's results (test name + outcome +
# first line of any failure message; timestamps/durations/machine names
# stripped), and diffs them against a linux-x64 baseline. A test silently
# skipped, or a different Theory case count, or a platform-dependent
# assertion message, fails this even though every platform individually
# reports "green."
#
# Scoped to net10.0 only (not the full net462-net10.0 TFM matrix) — this
# is about OS/architecture differences, not TFM differences, and net10.0
# is the one TFM that genuinely runs on all 4 platforms below (net462
# is Windows-only; ARM64 Linux/macOS runners don't carry .NET Framework).

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 4'  # weekly Thursday 11:00 UTC

permissions:
  contents: read

jobs:
  test:
    name: "Run tests (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.x'

      - name: Run tests (net10.0)
        shell: bash
        run: |
          set -euo pipefail
          # Every test project under tests/ (references Microsoft.NET.Test.Sdk) that targets
          # net10.0, each with its own TRX file. Fixtures and smoke executables are skipped.
          mkdir -p "$GITHUB_WORKSPACE/trx"
          count=0
          while IFS= read -r proj; do
            grep -q 'Microsoft.NET.Test.Sdk' "$proj" || continue
            grep -qE '<TargetFrameworks?>[^<]*net10\.0' "$proj" || continue
            name="$(basename "$proj" .csproj)"
            dotnet test "$proj" --configuration Release --framework net10.0 \
              --logger "trx;LogFileName=$name.trx" --results-directory "$GITHUB_WORKSPACE/trx"
            count=$((count + 1))
          done < <(git ls-files 'tests/**/*.csproj')
          if [ "$count" -eq 0 ]; then
            echo "::error::No net10.0 test project found under tests/."
            exit 1
          fi

      - name: Normalize results
        shell: bash
        env:
          OS_NAME: ${{ matrix.os }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/normalized-$OS_NAME.txt"
          : > "$out"
          for trx in "$GITHUB_WORKSPACE"/trx/*.trx; do
            name="$(basename "$trx" .trx)"
            python3 scripts/normalize-trx.py "$trx" "$RUNNER_TEMP/one.txt"
            # Prefix each line with the test project, so the same test name in two projects stays distinct.
            awk -v p="$name" '{ print p "\t" $0 }' "$RUNNER_TEMP/one.txt" >> "$out"
          done
          test -s "$out"

      - name: Upload normalized results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: normalized-${{ matrix.os }}
          path: normalized-${{ matrix.os }}.txt

  compare:
    name: "Diff results across platforms"
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download all normalized results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: normalized-*
          path: results
          merge-multiple: true

      - name: Diff every platform against the linux-x64 baseline
        run: |
          baseline="results/normalized-ubuntu-latest.txt"
          if [ ! -f "$baseline" ]; then
            echo "::error::Baseline file $baseline not found — the ubuntu-latest job may have failed before uploading."
            exit 1
          fi

          failed=0
          for f in results/normalized-*.txt; do
            name=$(basename "$f" .txt)
            if [ "$f" == "$baseline" ]; then
              continue
            fi

            if diff -q "$baseline" "$f" > /dev/null; then
              echo "✅ $name matches linux-x64 baseline exactly."
            else
              echo "::error::$name diverges from the linux-x64 baseline:"
              diff "$baseline" "$f" || true
              failed=1
            fi
          done

          if [ "$failed" -eq 1 ]; then
            echo "::error::One or more platforms produced different test results than linux-x64 — not just pass/fail, but which tests ran and how they resolved."
            exit 1
          fi

          echo "All platforms produced identical test results."
