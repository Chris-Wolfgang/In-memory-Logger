version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      dotnet-dependencies:
        patterns:
          - "*"
    ignore:
      # Microsoft.Extensions.Logging 11.x dropped net8.0/net9.0, so the src csproj keeps its
      # net8.0 asset on the 10.0.x line (#427). Dependabot cannot tell the per-TFM references
      # apart and would bump that one to 11.x too, so major versions of these packages move by
      # hand, together with the TFM list. Minor and patch updates still flow.
      - dependency-name: "Microsoft.Extensions.Logging"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Logging.Abstractions"
        update-types: ["version-update:semver-major"]
      # Microsoft.NET.Test.Sdk 18.x refuses every framework below net8.0, so the Tests.Unit and
      # Tests.Integration .NET Framework / net5.0-net7.0 slots keep 17.x by a per-TFM reference
      # that Dependabot cannot tell apart from the net8.0+ one. The net8.0+ references and the
      # net10.0-only projects move by hand to each 18.x release.
      - dependency-name: "Microsoft.NET.Test.Sdk"
        versions: [">= 18.0.0"]

  # Keep third-party GitHub Actions pinned in workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

  # Keep the hash-pinned pip tooling (zizmor, semgrep) under .github/requirements
  # up to date. Without this the --require-hashes pins never move, leaving both
  # tools frozen at whatever version was current when they were pinned;
  # Dependabot regenerates the hashes along with the versions.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      pip-tooling:
        patterns:
          - "*"
    ignore:
      # semgrep.txt is compiled by uv with `--override semgrep-overrides.txt`, which forces newer
      # mcp / opentelemetry releases than semgrep itself pins (semgrep requires mcp==1.29.0 and
      # opentelemetry ~=1.37). Dependabot's pip resolver has no notion of an override, so every
      # attempt to bump semgrep or any package in the overridden OpenTelemetry family fails
      # (dependency_file_not_resolvable on run 42162259409, 2026-11-06; unknown_error on
      # opentelemetry-semantic-conventions on repo-template run 42889886810, 2026-11-10, after
      # only three names were ignored) and leaves a red "Dependabot Updates" run. The whole family
      # is pinned in lockstep by the override file, so ignore it by prefix. They move only by
      # regenerating (from .github/requirements):
      #   uv pip compile --universal --generate-hashes --upgrade --override semgrep-overrides.txt semgrep.in -o semgrep.txt
      - dependency-name: "semgrep"
      - dependency-name: "opentelemetry-*"
      # semgrep imports mcp.server.fastmcp, which mcp 2.x removed: with mcp 2.3.0 in
      # semgrep-overrides.txt (Dependabot bump) semgrep crashes at import and the scan
      # writes no SARIF. Keep the override on the 1.x line; semgrep itself pins mcp 1.x.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
